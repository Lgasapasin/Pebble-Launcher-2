[package]
name = "pebble-launcher"
version = "0.1.0"
edition = "2021"
description = "Minimal Minecraft Java Edition launcher"
license = "MIT"

[lib]
name = "pebble_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "process", "io-util", "sync"] }
futures-util = "0.3"
sha1 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
keyring = "3"
urlencoding = "2"
