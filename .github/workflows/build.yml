name: Build Pebble Launcher (AppImage only)

# Manual build only. No Windows or Debian jobs are triggered.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-22.04
    env:
      # Helps AppImage packaging tools run on CI machines without FUSE mounts.
      APPIMAGE_EXTRACT_AND_RUN: "1"

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Tauri Linux prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Check source completeness
        run: python3 scripts/check_source.py

      - name: Check Rust syntax with rustfmt
        run: cargo fmt --all
        working-directory: src-tauri

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck UI
        run: npm run check

      - name: Build AppImage only
        run: npm run build:appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: pebble-launcher-v0.1-linux-x86_64-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
